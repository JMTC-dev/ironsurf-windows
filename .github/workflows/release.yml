name: Release

# Two ways in, one result: every platform's binary, built here, attached to
# one release with a SHA256SUMS.txt.
#
# - By hand (Actions → Release → Run workflow), with a tag: the binaries go
#   to the release carrying that tag — a new *draft* if there is none, so
#   nothing is public until it is published (the tag is created then). An
#   existing release (draft or not) has its files replaced. GitHub runs no
#   workflows for draft releases themselves, so this is the way to fill one.
# - Creating a published release (not a draft) builds and attaches to it.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0-windows.2 (a draft is created if none has it)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      # One release holds every platform: a failed build stops the publish job
      # anyway, so there is no point finishing the others.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ironsurf-linux-x86_64
          - os: macos-latest
            artifact: ironsurf-macos-arm64
          - os: windows-latest
            artifact: ironsurf-windows-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libfontconfig-dev libudev-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev libgbm1 libgbm-dev libinput-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config fontconfig openssl@3
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/fontconfig/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig:/usr/local/opt/fontconfig/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/homebrew/opt/openssl@3/lib -L/opt/homebrew/opt/fontconfig/lib${LDFLAGS:+ $LDFLAGS}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/opt/homebrew/opt/openssl@3/include -I/opt/homebrew/opt/fontconfig/include${CPPFLAGS:+ $CPPFLAGS}" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --workspace

      - name: Smoke the single binary
        # IronSurf ships ONE executable: it is the shell and, when re-executed
        # per tab, the tab host. Prove it exists and answers before packaging.
        shell: bash
        run: |
          exe=target/release/ironsurf
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$exe.exe"; fi
          test -x "$exe"
          "./$exe" --version
          "./$exe" --help >/dev/null
          "./$exe" tab --help >/dev/null

      - name: Package binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging out
          cp target/release/ironsurf "staging/${{ matrix.artifact }}"
          chmod +x "staging/${{ matrix.artifact }}"
          tar -czf "out/${{ matrix.artifact }}.tar.gz" -C staging "${{ matrix.artifact }}"

      # Windows ships a zip holding `ironsurf.exe` (the name the tab host
      # re-executes is whatever the file is called, so it stays `ironsurf`).
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path target/release/ironsurf.exe -DestinationPath "out/${{ matrix.artifact }}.zip"

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Attach (or draft) the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          case "$TAG" in
            ""|*[[:space:]]*) echo "::error::not a usable tag: '$TAG'"; exit 1 ;;
          esac
          # `gh release view` finds drafts too (their tag does not exist yet).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "Attached to the existing release $TAG."
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            echo "Created the draft release $TAG — review and publish it."
          fi
