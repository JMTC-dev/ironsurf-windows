[package]
name = "ironsurf-tab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ironsurf-common = { path = "../ironsurf-common" }
ironsurf-storage = { path = "../ironsurf-storage" }
ironsurf-sandbox = { path = "../ironsurf-sandbox" }
url = { workspace = true }
# `<script type="importmap">` bodies are JSON (task: importmap support); the
# crate is already locked and compiled in the graph (boa_engine's `deser`).
serde_json = "1"
libc = "0.2"
euclid = "0.22"
# 0.13 (same major blitz-net pins — one reqwest in the tree): its blocking
# builder is where the HTTP/2 keep-alive/adaptive-window knobs live, and
# `rustls-tls` was renamed `rustls` there.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "gzip", "brotli", "deflate", "http2", "charset"] }

# Engine stack (ARCHITECTURE.md, pinned; pure Rust — no mozjs, no wgpu/GPU)
# `floats` is MANDATORY, not an optimisation: blitz-dom registers every CSS
# `float:` element as a parley `CustomOutOfFlow` inline box, and only the
# floats-enabled layout driver consumes those `InlineBoxBreak` yields — with
# the feature off `break_all_lines` spins forever on any page with a float
# (DDG-lite's anomaly modal) → tab hangs, blank page. Enable explicitly.
blitz-dom = { version = "0.3.0-beta.2", features = ["floats"] }
blitz-html = "0.3.0-beta.2"
blitz-net = "0.3.0-beta.2"
# `custom-widget` is what lets a `<video>` element be painted by the tab's own
# decode pipeline (see src/media/widget.rs); blitz-dom has it on by default.
blitz-paint = { version = "0.3.0-beta.2", features = ["custom-widget"] }
blitz-traits = "0.3.0-beta.2"
# JavaScript (task 8): pure Rust, no mozjs/spidermonkey in the tree.
# EVERY boa_engine language feature so as much JS as possible is supported:
# annex-b (legacy web compat: `substr`/`trimLeft`, legacy octal & escapes,
# regex quirks), intl_bundled (full `Intl` with self-contained ICU data —
# no system data needed headless), temporal (the `Temporal` dates/times
# API), float16 + xsum (f16/sum-numerals literals), experimental +
# jsvalue-enum + native-backtrace + deser + embedded_lz4 + either (surface
# and tooling extras). Skipped on purpose: `js`/`trace` (wasm-only),
# `fuzz` (needs arbitrary), `flowgraph` (debug-only IR).
boa_engine = { version = "0.22", features = ["annex-b", "intl_bundled", "jsvalue-enum", "native-backtrace", "deser", "either", "embedded_lz4", "experimental"] }
# boa_runtime: the whole Web-API layer WinterTC-style — `atob`/`btoa`,
# `queueMicrotask`, `structuredClone`, `TextEncoder`/`TextDecoder`,
# `AbortController`/`AbortSignal`, `URL`, `console`, `process`, and `fetch`
# (via reqwest's blocking client; its promises settle from the job-queue
# drain after every script turn). `all` = fetch + url + reqwest-blocking.
boa_runtime = { version = "0.22", features = ["all", "process", "annex-b"] }
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
# Geometry/brush types named directly in the paint callback; same versions
# anyrender 0.13 uses (kurbo 0.13.1 / peniko 0.6).
kurbo = "0.13"
peniko = "0.6"
# parley is the very crate blitz-dom lays text out with (already locked in the
# graph): find-in-page asks it for the selection geometry of a matched byte
# range so highlights land on the glyphs (src/find.rs).
parley = "0.11"
# Input event types (task 7d): same versions blitz 0.3.0-beta.2 uses.
keyboard-types = "0.7"
# The very crate blitz's `Document::get_cursor` reports CSS `cursor` values
# in (already in the graph via blitz-dom): the tab names its variants to map
# them onto the IPC `CursorIcon` (task: hover cursor).
cursor-icon = "1.2"
atomic_refcell = "0.1"
# CSS diagnostics (task: DevTools console): the very `stylo` blitz aliases as
# `style` (already locked and compiled by the engine graph) re-parses the
# document's CSS behind a real ParseErrorReporter (see src/logging.rs).
# `cssparser`/`selectors` are the same locked versions providing the reporter
# trait's argument types — zero extra compilation.
style = { version = "0.20.0", package = "stylo" }
# `getComputedStyle` serializes stylo computed values with the very `ToCss`
# trait they implement (already locked and compiled by the engine graph).
style_traits = { version = "0.20.0", package = "stylo_traits" }
cssparser = "0.37"
selectors = "0.40"

# Video (task: playback) — pure Rust software decoders, no C, no GPU.
rusty_h264-decoder = "0.16"
vp9dec = "0.1"
jpeg-decoder = "0.3"

[dev-dependencies]
tempfile = "3"
# Only for tests: the `stylo` crate blitz aliases as `style` (same version the
# engine graph already locks), needed to build the initial `ComputedValues`
# blitz hands to `Widget::paint` — it has no `Default`.
style = { version = "0.20.0", package = "stylo" }
# `BlitzPointerEvent::active_pointers` is an `Arc<AtomicRefCell<Vec<_>>>`.
atomic_refcell = "0.1"
