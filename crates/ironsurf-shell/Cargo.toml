[package]
name = "ironsurf-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
ironsurf-common = { path = "../ironsurf-common" }
ironsurf-storage = { path = "../ironsurf-storage" }
slint = { workspace = true }
chrono = "0.4"
serde = { workspace = true }
serde_json = "1"
libc = "0.2"
url = { workspace = true }
# system clipboard bridge (task: text-selection copy & paste); pure-Rust X11
# (x11rb over libxcb + libxcb-xfixes), no GPU, no display-server toolkit.
arboard = "3"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"
tempfile = "3"

# No shell binary of its own: the Slint GUI links into the single `ironsurf`
# binary (built by ../ironsurf-tab, which depends on this crate as a library).

# A scripted stand-in for ironsurf-tab used by the headless pump tests
# (see ARCHITECTURE.md §ironsurf-shell "Tests"). It also doubles as an
# escape hatch when the real (Servo) binary is not built yet.
[[bin]]
name = "fake_tab"
path = "src/bin/fake_tab.rs"
