[package]
name = "servfox-sandbox"
version = "0.1.0"
edition = "2021"
description = "Per-tab OS sandboxing: prctl + rlimits + Landlock (graceful degradation)"

[dependencies]
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sbox-probe"
path = "src/bin/sbox_probe.rs"
