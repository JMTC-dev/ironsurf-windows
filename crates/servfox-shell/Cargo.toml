[package]
name = "servfox-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
servfox-common = { path = "../servfox-common" }
servfox-storage = { path = "../servfox-storage" }
slint = { workspace = true }
serde = { workspace = true }
serde_json = "1"
url = { workspace = true }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
i-slint-backend-testing = "1.17.1"
tempfile = "3"

[[bin]]
name = "servfox-shell"
path = "src/main.rs"

# A scripted stand-in for servfox-tab used by the headless pump tests
# (see ARCHITECTURE.md §servfox-shell "Tests"). It also doubles as an
# escape hatch when the real (Servo) binary is not built yet.
[[bin]]
name = "fake_tab"
path = "src/bin/fake_tab.rs"
