[package]
name = "ironsurf-sandbox"
version = "0.1.0"
edition = "2021"
description = "Per-tab OS sandboxing: prctl + rlimits + Landlock (graceful degradation)"

[dependencies]
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Windows: integrity labels, process mitigation policies and job objects
# (src/windows.rs); the same 0.61 the graph already locks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sbox-probe"
path = "src/bin/sbox_probe.rs"
