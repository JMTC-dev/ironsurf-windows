[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
# GPU acceleration: `backend-linuxkms-noseat` compiles Slint's LinuxKMS backend
# (DRM/KMS + EGL/GBM via glutin + FemtoVG) so the shell can render on a bare
# virtual console without X/Wayland. `renderer-femtovg` (default feature) is the
# GPU renderer for both winit and linuxkms; `renderer-software` stays compiled
# in as the automatic fallback on GL-less displays.
slint = { version = "1", features = ["backend-linuxkms-noseat"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"
url = "2"

[profile.release]
debug = false

# `vp9dec` (the VP7/8/9 bitstream decoder behind the tab's video path) crashes
# rustc at opt-level=3 (SIGSEGV in the LLVM pipeline on this box); keep it at
# opt-level=1 in release builds — bitstream decoding is not hot enough for -O3.
[profile.release.package.vp9dec]
opt-level = 1
